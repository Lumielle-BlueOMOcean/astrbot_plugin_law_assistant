name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Quality / Unit
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and test tools
        run: python -m pip install -r requirements.txt pytest pytest-asyncio ruff quart
      - name: Compile
        run: python -m compileall .
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff check
        run: ruff check .
      - name: Unit tests
        run: pytest
      - name: Frontend lifecycle tests
        run: node --test tests/page_lifecycle.test.mjs
      - name: Diff check
        run: git show --check --format= HEAD

  astrbot-compatibility:
    name: AstrBot compatibility (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 4.22.0
            commit: 81c7b0f7150485beb6124a7ec524a8d8534e7f6e
          - version: 4.25.0
            commit: 02291a3217c92faa0c577bf9d89076949c40954c
    steps:
      - name: Check out plugin repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download exact AstrBot source commit
        env:
          ASTRBOT_COMMIT: ${{ matrix.commit }}
        run: |
          archive="$RUNNER_TEMP/astrbot-$ASTRBOT_COMMIT.tar.gz"
          curl --fail --location --retry 3 --output "$archive" "https://codeload.github.com/AstrBotDevs/AstrBot/tar.gz/$ASTRBOT_COMMIT"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          echo "ASTRBOT_SOURCE=$RUNNER_TEMP/AstrBot-$ASTRBOT_COMMIT" >> "$GITHUB_ENV"
      - name: Install the exact AstrBot source and smoke dependencies
        run: |
          python -m pip install "$ASTRBOT_SOURCE"
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio ruff
      - name: Run real loader compatibility smoke
        run: python tests/compatibility_smoke.py "$ASTRBOT_SOURCE" --commit "${{ matrix.commit }}"

  release-package:
    name: Release package smoke (${{ matrix.version }})
    needs: [quality, astrbot-compatibility]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 4.22.0
            commit: 81c7b0f7150485beb6124a7ec524a8d8534e7f6e
          - version: 4.25.0
            commit: 02291a3217c92faa0c577bf9d89076949c40954c
    steps:
      - name: Check out plugin repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download exact AstrBot source commit
        env:
          ASTRBOT_COMMIT: ${{ matrix.commit }}
        run: |
          archive="$RUNNER_TEMP/astrbot-$ASTRBOT_COMMIT.tar.gz"
          curl --fail --location --retry 3 --output "$archive" "https://codeload.github.com/AstrBotDevs/AstrBot/tar.gz/$ASTRBOT_COMMIT"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          echo "ASTRBOT_SOURCE=$RUNNER_TEMP/AstrBot-$ASTRBOT_COMMIT" >> "$GITHUB_ENV"
      - name: Install exact AstrBot and plugin dependencies
        run: |
          python -m pip install "$ASTRBOT_SOURCE"
          python -m pip install -r requirements.txt
      - name: Build clean release ZIP
        run: python scripts/build_release.py --output "$RUNNER_TEMP/release"
      - name: Extract release ZIP
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked"
          unzip -q "$RUNNER_TEMP/release/astrbot_plugin_law_assistant-0.5.0.zip" -d "$RUNNER_TEMP/unpacked"
      - name: Compile extracted plugin
        run: python -m compileall "$RUNNER_TEMP/unpacked/astrbot_plugin_law_assistant"
      - name: Run extracted package loader smoke
        run: python tests/compatibility_smoke.py "$ASTRBOT_SOURCE" --commit "${{ matrix.commit }}" --plugin-root "$RUNNER_TEMP/unpacked/astrbot_plugin_law_assistant"
      - name: Run real AstrBot Plugin Page discovery smoke
        if: matrix.version == '4.25.0'
        run: python tests/page_discovery_smoke.py "$ASTRBOT_SOURCE" "$RUNNER_TEMP/unpacked/astrbot_plugin_law_assistant"
      - name: Run real AstrBot Plugin API route contract smoke
        if: matrix.version == '4.25.0'
        run: python tests/web_api_route_smoke.py "$ASTRBOT_SOURCE" "$RUNNER_TEMP/unpacked/astrbot_plugin_law_assistant"
      - name: Upload release ZIP artifact
        if: matrix.version == '4.25.0'
        uses: actions/upload-artifact@v4
        with:
          name: astrbot_plugin_law_assistant-0.5.0
          path: ${{ runner.temp }}/release/astrbot_plugin_law_assistant-0.5.0.zip
          if-no-files-found: error
