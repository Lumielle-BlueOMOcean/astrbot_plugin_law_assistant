<h1>关于举办第九届（2026）法律专业学位研究生法律文书写作大赛的通知</h1>
<div class="date">2026/3/9</div>
<p>本次大赛由厦门大学研究生院、厦门大学法学院联合主办。</p>
<p>参赛对象：全国各法律专业学位研究生培养单位在读全日制法律硕士专业学位研究生。</p>
<p>初赛投稿截止时间为3月26日18:00，复赛拟定于4月19日下午，决赛拟定于5月23日上午举行。</p>
<p>参赛选手将作品以电子邮件形式投至赛事官方邮箱，完成报名和初赛作品提交。</p>
</main></body></html>
