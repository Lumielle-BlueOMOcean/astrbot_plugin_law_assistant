<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>微光·法务助手</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">LUMIELLE LAW ASSISTANT</p>
          <h1>微光·法务助手</h1>
          <p id="page-description" class="muted">证据驱动的法律学习与活动管理面板</p>
        </div>
        <div id="context-badge" class="badge">Dashboard</div>
      </header>
      <div class="layout">
        <nav id="navigation" class="navigation" aria-label="主导航"></nav>
        <main id="main-content" class="content" aria-live="polite">
          <div id="flash" class="flash" hidden></div>
          <section id="view-overview" class="view"></section>
          <section id="view-library" class="view" hidden></section>
          <section id="view-radar" class="view" hidden></section>
          <section id="view-plans" class="view" hidden></section>
          <section id="view-targets" class="view" hidden></section>
          <section id="view-history" class="view" hidden></section>
        </main>
      </div>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
